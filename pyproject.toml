[project]
name = "techtimes-apiv3"
version = "0.1.0"
description = "backend for techtimes"
readme = "README.md"
authors = [
    { name = "Goooosi", email = "166347594+Goooosi@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "granian>=2.8.7",
    "python-dotenv>=1.2.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.pyright]
extraPaths = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["cms", "core", "schoolCalendar"]
